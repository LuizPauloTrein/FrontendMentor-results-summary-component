<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <title>Frontend Mentor | Results summary component</title>
</head>

<body>
  <main class="container">
    <section class="result">
      <h2>Your Result</h2>
      <div class="total">
        <span class="score">76</span>
        <span class="of">of 100</span>
      </div>
      <h3>Great</h3>
      <p class="feedback">You scored higher than 65% of the people who have taken these tests.</p>
    </section>
    <section class="summary">
      <h2>Summary</h2>
      <ul class="classes-grades">
        <li class="grade reaction-class">
          <div class="grade-info">
            <img src="assets/images/icon-reaction.svg" alt="Reaction class icon">
            <p class="reaction">Reaction</p>
          </div>
          <p class="total-grade"><span>80</span> / 100</p>
        </li>
        <li class="grade memory-class">
          <div class="grade-info">
            <img src="assets/images/icon-memory.svg" alt="Memory class icon">
            <p class="memory">Memory</p>
          </div>
          <p class="total-grade"><span>92</span> / 100</p>
        </li>
        <li class="grade verbal-class">
          <div class="grade-info">
            <img src="assets/images/icon-verbal.svg" alt="Verbal class icon">
            <p class="verbal">Verbal</p>
          </div>
          <p class="total-grade"><span>61</span> / 100</p>
        </li>
        <li class="grade visual-class">
          <div class="grade-info">
            <img src="assets/images/icon-visual.svg" alt="Visual class icon">
            <p class="visual">Visual</p>
          </div>
          <p class="total-grade"><span>72</span> / 100</p>
        </li>
      </ul>
      <button class="btn-continue" type="button">Continue</button>
    </section>
  </main>

</body>

</html>
